<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sheila 💖</title>
  <style>
    body {
      font-family: 'Comic Sans MS', Arial, sans-serif;
      background: linear-gradient(135deg, #ffb6c1, #ffc0cb);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      max-width: 320px;
    }

    h1 {
      color: #ff4d6d;
    }

    button {
      font-size: 18px;
      padding: 10px 20px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin: 10px;
    }

    #yesBtn {
      background: #ff4d6d;
      color: white;
    }

    #noBtn {
      background: #ccc;
      position: absolute;
    }

    #message {
      margin-top: 20px;
      font-size: 20px;
      color: #ff4d6d;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Sheila 💕</h1>
    <h2>Will you be my Valentine? 💘</h2>

    <button id="yesBtn" onclick="yesClick()">Yes 💖</button>
    <button id="noBtn" onmouseover="moveNo()">No 💔</button>

    <div id="message"></div>
  </div>

  <script>
    function yesClick() {
      document.getElementById("message").innerHTML =
        "YAYYY 🥰💞 I’m so happy!";
    }

    function moveNo() {
      const noBtn = document.getElementById("noBtn");
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 50);
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }
  </script>

</body>
</html>
